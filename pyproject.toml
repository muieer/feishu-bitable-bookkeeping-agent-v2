[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "feishu-bookkeeping-agent"
version = "0.1.0"
description = "基于 LangChain 的飞书自主记账智能体"
requires-python = ">=3.11"
dependencies = [
  "langchain==1.4.6",
  "langchain-core==1.6.10",
  "langchain-openai==1.7.2",
  "langgraph==1.2.15",
  "langsmith==0.14.8",
  "lark-channel-sdk==1.4.0",
  "pydantic-settings==2.15.0",
  "httpx==0.28.1",
  "openai==3.29.0",
  "cn2an>=0.5.23,<0.6",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17,<1"]

[project.scripts]
bookkeeping = "bookkeeping.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bookkeeping"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
